image:
  name:
    - "ssh-pod-alpha"
    - "ssh-pod-gamma"
    - "ssh-pod-beta"
  repository:
    - "linuxserver/openssh-server"
    - "linuxserver/openssh-server"
    - "linuxserver/openssh-server"
  tag: "latest"
volumes:
  sshkeyvolume:
    name: "ssh-key-volume"
    secretName: awx-ssh-authorized-key
    items:
      - key: authorized_keys
        path: authorized_keys
  emptydir:
    name: linuxserver-home
    emptyDir: {}
replicaCount: 1
command:
            - sh
            - -c
            - |
              set -e

              echo "=== Preparing SSH home directory ==="

              mkdir -p /config/.ssh

              # Fix home directory ownership/permissions for StrictModes
              chown 1000:1000 /config/.ssh
              chmod 755 /config/.ssh

              # Install AWX public key
              cp /secret/authorized_keys /config/.ssh/authorized_keys

              # Fix SSH directory ownership/permissions
              chown 1000:1000 /config/.ssh
              chmod 700 /config/.ssh

              # Fix authorized_keys ownership/permissions
              chown 1000:1000 /config/.ssh/authorized_keys
              chmod 600 /config/.ssh/authorized_keys

              echo "=== SSH authorized_keys installed ==="

              ls -ld /config/
              ls -ld /config/.ssh
              ls -l /config/.ssh/authorized_keys
service:
  metadata:
    name: ssh-service-alpha
    name: ssh-service-gamma
    name: ssh-service-beta
   
  port: 2222
  targetPort: 22
  selector:
    app: ssh-server
    instance: alpha
    app: ssh-server
    instance: beta
    app: ssh-server
    instance: gamma
