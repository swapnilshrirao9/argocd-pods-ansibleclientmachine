{{- range $index, $name := .Values.service.metadata.name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: {{ $.Values.service.targetPort }}
  selector:
    app: {{ $.Values.service.selector.app }}
    # यह ऑटोमैटिकली इंडेक्स के आधार पर सही इंस्टेंस (alpha, gamma, beta) को चुनेगा
    instance: {{ index $.Values.image.name $index }}
---
{{- end }}

